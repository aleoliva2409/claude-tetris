<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="title" aria-label="TETRIS">
      <span style="--c:#e57373" aria-hidden="true">T</span><span style="--c:#ffb74d" aria-hidden="true">E</span><span style="--c:#ffd54f" aria-hidden="true">T</span><span style="--c:#81c784" aria-hidden="true">R</span><span style="--c:#4dd0e1" aria-hidden="true">I</span><span style="--c:#ba68c8" aria-hidden="true">S</span>
    </h1>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
            <li><kbd>T</kbd> tema</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden" data-mode="gameover">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div class="menu">
          <button id="resume-btn" class="menu-btn primary pause-only">Reanudar</button>
          <button id="restart-btn" class="menu-btn">Reiniciar</button>
          <button id="controls-btn" class="menu-btn pause-only" aria-expanded="false" aria-controls="menu-controls">Ver controles</button>

          <ul id="menu-controls" class="menu-controls pause-only" hidden>
            <li><span><kbd>←</kbd><kbd>→</kbd></span> mover</li>
            <li><span><kbd>↑</kbd><kbd>X</kbd></span> rotar</li>
            <li><span><kbd>↓</kbd></span> bajar</li>
            <li><span><kbd>Space</kbd></span> caída rápida</li>
            <li><span><kbd>P</kbd><kbd>Esc</kbd></span> pausa / reanudar</li>
            <li><span><kbd>T</kbd></span> cambiar tema</li>
          </ul>

          <div class="level-picker">
            <span class="label">NIVEL INICIAL</span>
            <div class="level-stepper">
              <button id="level-down" class="step-btn" aria-label="Bajar nivel inicial">−</button>
              <span id="start-level" class="value" aria-live="polite">1</span>
              <button id="level-up" class="step-btn" aria-label="Subir nivel inicial">+</button>
            </div>
            <span class="level-hint">se aplica en la próxima partida</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
