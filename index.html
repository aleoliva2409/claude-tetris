<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="title" aria-label="TETRIS">
      <span style="--c:#e57373" aria-hidden="true">T</span><span style="--c:#ffb74d" aria-hidden="true">E</span><span style="--c:#ffd54f" aria-hidden="true">T</span><span style="--c:#81c784" aria-hidden="true">R</span><span style="--c:#4dd0e1" aria-hidden="true">I</span><span style="--c:#ba68c8" aria-hidden="true">S</span>
    </h1>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>T</kbd> tema</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <!-- ---- Records ---- -->
        <div id="records" class="records" hidden>
          <div id="name-form" class="name-form" hidden>
            <p class="records-new">¡Nuevo récord!</p>
            <div class="name-row">
              <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" spellcheck="false" />
              <button id="save-record-btn" class="btn-small">Guardar</button>
            </div>
          </div>
          <span class="label">RECORDS</span>
          <table id="records-table" class="records-table" hidden>
            <thead>
              <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th><th>Combo</th></tr>
            </thead>
            <tbody id="records-body"></tbody>
          </table>
          <p id="records-empty" class="records-empty">Sin records todavía</p>
          <p id="records-stats" class="records-stats" hidden></p>
          <button id="clear-records-btn" class="btn-small btn-danger" hidden>Borrar records</button>
        </div>
        <button id="play-btn" hidden>Jugar</button>
        <!-- ---- /Records ---- -->

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
