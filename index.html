<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="title" aria-label="TETRIS">
      <span style="--c:#e57373" aria-hidden="true">T</span><span style="--c:#ffb74d" aria-hidden="true">E</span><span style="--c:#ffd54f" aria-hidden="true">T</span><span style="--c:#81c784" aria-hidden="true">R</span><span style="--c:#4dd0e1" aria-hidden="true">I</span><span style="--c:#ba68c8" aria-hidden="true">S</span>
    </h1>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
            <li><kbd>T</kbd> tema</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <form id="name-form" class="name-form hidden" autocomplete="off">
          <label for="name-input" id="name-label">¡Nuevo récord!</label>
          <div class="name-row">
            <input id="name-input" type="text" maxlength="12" placeholder="Tu nombre" />
            <button type="submit">Guardar</button>
          </div>
        </form>

        <section id="records" class="records">
          <span class="label">RÉCORDS</span>
          <table class="records-table">
            <thead>
              <tr><th>#</th><th>Nombre</th><th>Puntos</th><th>Líneas</th></tr>
            </thead>
            <tbody id="records-body"></tbody>
          </table>
          <p class="records-extra">
            Mejor combo: <strong id="best-combo">0</strong> · Líneas máx.: <strong id="max-lines">0</strong>
          </p>
          <button type="button" id="reset-records-btn" class="link-btn">Borrar récords</button>
        </section>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
